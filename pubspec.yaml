# Root of the pub workspace (melos-managed monorepo).
# Holds no library code — just declares the workspace members + dev tooling.
name: neo_sdui_workspace
description: Melos workspace for neo_sdui and its add-on packages.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.11.1

# Pub workspace members. Add-on packages join here as they land.
workspace:
  - packages/neo_sdui
  - packages/neo_sdui_media
  - packages/neo_sdui_syntax

dev_dependencies:
  melos: ^8.2.0
  # Only so `flutter analyze deliverables/**/theme.dart` can type-check a figwire
  # emit that binds fonts via GoogleFonts.* (the ledger's `imports`). Without it
  # the analyzer degrades to `Undefined name 'GoogleFonts'` and stops checking the
  # call's ARGUMENTS — which is how `fontFamilyFallback:` (not a param of the
  # generated methods) reached a device build. neo_sdui itself stays flutter+meta.
  google_fonts: ^6.3.3
