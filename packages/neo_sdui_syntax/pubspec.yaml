name: neo_sdui_syntax
description: "neo_sdui add-on: re-registers the `code` block to syntax-highlight its content by language, keeping the copy affordance. Scaffold — highlighting is a placeholder badge until flutter_highlight is wired."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.1
  flutter: ">=1.17.0"

# Member of the root pub workspace (melos-managed monorepo).
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  neo_sdui:
    path: ../neo_sdui
  # Real syntax highlighting for the `code` block (HighlightView in
  # src/syntax_code.dart). Pinned to the classic 0.7.x API (hyphenated theme
  # imports, no ensureInitialized).
  flutter_highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
