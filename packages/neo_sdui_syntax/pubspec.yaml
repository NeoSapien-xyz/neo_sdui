name: neo_sdui_syntax
description: "neo_sdui add-on: re-registers the `code` block to syntax-highlight its content by language, keeping the copy affordance. Scaffold — highlighting is a placeholder badge until flutter_highlight is wired."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.1
  flutter: ">=1.17.0"

# Member of the root pub workspace (melos-managed monorepo).
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  neo_sdui:
    path: ../neo_sdui
  # ponytail: add `flutter_highlight: ^0.7.0` when replacing the placeholder in
  # syntax_code.dart with a real HighlightView. Deferred until wire content needs
  # coloring (see docs/plans/2026-07-12-001-feat-neo-sdui-code-block-plan.md).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
