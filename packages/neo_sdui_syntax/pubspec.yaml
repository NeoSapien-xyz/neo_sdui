name: neo_sdui_syntax
description: "neo_sdui add-on: re-registers the `code` block to syntax-highlight its content by language, keeping the copy affordance. Scaffold — highlighting is a placeholder badge until flutter_highlight is wired."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.1
  flutter: ">=1.17.0"

# Member of the root pub workspace (melos-managed monorepo).
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Core declared as a git dep (not `path:`) so `melos version` can keep its
  # `ref:` on the per-package `neo_sdui-v<version>` tag (see melos.yaml
  # updateGitTagRefs). Locally the pub workspace resolves this to the sibling
  # package by name, so the ref is only consulted when the app pulls this add-on
  # transitively as a git dep — where a matching tag ref avoids pub's
  # "neo_sdui_syntax from git is forbidden" clash.
  neo_sdui:
    git:
      url: https://github.com/NeoSapien-xyz/neo_sdui.git
      path: packages/neo_sdui
      ref: neo_sdui-v0.1.0
  # Real syntax highlighting for the `code` block (HighlightView in
  # src/syntax_code.dart). Pinned to the classic 0.7.x API (hyphenated theme
  # imports, no ensureInitialized).
  flutter_highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
